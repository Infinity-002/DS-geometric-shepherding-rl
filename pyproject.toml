[project]
name = "shepherding-rl"
version = "0.1.0"
description = "Geometric-Informed Reinforcement Learning for the Shepherding Problem"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.29.0",
    "stable-baselines3>=2.1.0",
    "sb3-contrib>=2.1.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.4.0",
    "seaborn>=0.13.0",
    "jupyter>=1.0.0",
    "torch>=2.0.0",
    "pyyaml>=6.0",
    "streamlit>=1.56.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
train = "scripts.train:main"
evaluate = "scripts.evaluate:main"
train-v3-feedforward = "scripts.train_v3_feedforward:main"
train-v3-recurrent = "scripts.train_v3_recurrent:main"
evaluate-v3 = "scripts.evaluate_v3:main"
benchmark-v3 = "scripts.benchmark_v3:main"
run-ablations-v3 = "scripts.run_ablations_v3:main"
analyze-v3 = "scripts.analyze_results_v3:main"
analyze-ds = "scripts.analyze_ds_results:main"
evaluate-v2-benchmark = "scripts.evaluate_v2_benchmark:main"
generate-bc-dataset = "scripts.generate_bc_dataset:main"
train-bc = "scripts.train_bc:main"
