benchmark:
  seeds: [0]
  total_timesteps: 400000
  episodes: 6
  scenarios:
    train: ["train"]
    test: ["test_procedural"]
    unseen: ["unseen_split_field", "unseen_open_field"]
  variants:
    - run_name: heuristic_cluster_aware_improved
      model_type: heuristic
      env_overrides:
        # Decodes the raw observation vector, so it needs the original layout
        # and a fixed flock size.
        observation_mode: legacy
        randomize_sheep_count: false
        domain_randomization: false
        randomize_visibility: false
        randomize_goal: false
        randomize_obstacles: false
        randomize_dynamics: false
    - run_name: behavioral_cloning_rf_improved
      model_type: behavioral_cloning
      env_overrides:
        # Decodes the raw observation vector, so it needs the original layout
        # and a fixed flock size.
        observation_mode: legacy
        randomize_sheep_count: false
        domain_randomization: false
        randomize_visibility: false
        randomize_goal: false
        randomize_obstacles: false
        randomize_dynamics: false
    - run_name: recurrent_domain_randomized_improved
      model_type: recurrent
      env_overrides:
        domain_randomization: true
        randomize_visibility: true
        randomize_goal: true
        randomize_obstacles: true
        randomize_dynamics: true
