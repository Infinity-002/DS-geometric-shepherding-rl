benchmark:
  seeds: [0, 1, 2]
  total_timesteps: 250000
  episodes: 6
  scenarios:
    train: ["train"]
    test: ["test_procedural"]
    unseen:
      [
        "unseen_corridor",
        "unseen_dense",
        "unseen_narrow_gate",
        "unseen_split_field",
        "unseen_open_field",
      ]
  variants:
    - run_name: heuristic_baseline
      model_type: heuristic
      env_overrides:
        # The heuristic decodes the raw observation vector, so it needs the
        # original layout and a fixed flock size.
        observation_mode: legacy
        randomize_sheep_count: false
        domain_randomization: false
        randomize_visibility: false
        randomize_goal: false
        randomize_obstacles: false
        randomize_dynamics: false
    - run_name: feedforward_domain_randomized
      model_type: feedforward
      env_overrides:
        domain_randomization: true
        randomize_visibility: true
        randomize_goal: true
        randomize_obstacles: true
        randomize_dynamics: true
    - run_name: recurrent_domain_randomized
      model_type: recurrent
      env_overrides:
        domain_randomization: true
        randomize_visibility: true
        randomize_goal: true
        randomize_obstacles: true
        randomize_dynamics: true
    - run_name: recurrent_full_visibility
      model_type: recurrent
      env_overrides:
        domain_randomization: true
        randomize_visibility: false
        randomize_goal: true
        randomize_obstacles: true
        randomize_dynamics: true
        visibility_radius: 40.0

    # --- ablations for the generalization changes -----------------------------
    # Isolates the observation rewrite: same algorithm and randomization, but the
    # original sentinel/absolute-position/indexed-obstacle encoding.
    - run_name: recurrent_legacy_observation
      model_type: recurrent
      env_overrides:
        observation_mode: legacy
        randomize_sheep_count: false
        domain_randomization: true
        randomize_visibility: true
        randomize_goal: true
        randomize_obstacles: true
        randomize_dynamics: true
    # Isolates the rotation-invariant frame.
    - run_name: recurrent_goal_frame
      model_type: recurrent
      env_overrides:
        observation_mode: egocentric
        observation_frame: goal
        domain_randomization: true
        randomize_visibility: true
        randomize_goal: true
        randomize_obstacles: true
        randomize_dynamics: true
