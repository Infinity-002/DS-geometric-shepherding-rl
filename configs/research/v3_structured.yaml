environment:
  grid_size: 20.0
  n_sheep: 10
  dog_speed: 1.0
  sheep_speed: 0.32
  flee_radius: 5.5
  cohesion_factor: 0.07
  repulsion_strength: 1.0
  leader_factor: 0.04
  goal: [18.0, 18.0]
  max_steps: 650
  success_radius: 2.0
  visibility_radius: 8.5
  max_obstacles: 8
  obstacle_size_range: [0.8, 1.8]
  obstacle_avoidance_threshold: 1.6
  domain_randomization: true
  randomize_visibility: false
  randomize_goal: false
  randomize_obstacles: true
  randomize_dynamics: false
  compute_expensive_metrics: false
  curriculum_mode: true
  visibility_loss_penalty: 0.05
  visibility_gain_reward: 0.8
  collision_penalty: 0.2
  w_drive_position: 0.35
  drive_position_scale: 0.7
  zero_visibility_penalty: 0.25
  progress_reward_scale: 3.0
  worst_sheep_reward_scale: 4.0
  persistent_collision_scale: 0.15
  goal_seek_factor: 0.03
  structured_train_obstacles: true
  opposite_goal_spawn: true

  # --- observation encoding -------------------------------------------------
  max_sheep: 16
  observation_mode: egocentric
  observation_frame: world
  n_lidar_rays: 24
  lidar_range: 15.0
  randomize_sheep_count: true
  # Reduced from the original 125.0 now that returns are normalized.
  success_bonus: 20.0
  scenario: train

training:
  total_timesteps: 500000
  save_dir: models/research_v3_structured
  tensorboard_log: runs/research_v3_structured
  eval_episodes: 6
  vec_env:
    n_envs: 12
    vec_env_type: subproc
    normalize_observations: true
    normalize_rewards: true
  validation:
    enabled: true
    scenario: validation
    episodes: 8
    eval_freq: 25000
    seed: 10000
  curriculum:
    strategy: adaptive
    window: 30
    warmup_episodes: 8
    stages:
      - stage: 0.0
        min_success_rate: 0.0
      - stage: 0.33
        min_fraction_at_goal: 0.3
        min_visibility_ratio: 0.45
        max_collision_event_count: 8.0
        min_progress_reward: -0.02
        min_timestep_ratio: 0.05
      - stage: 0.66
        min_fraction_at_goal: 0.55
        min_visibility_ratio: 0.55
        max_collision_event_count: 6.0
        min_progress_reward: 0.0
        min_timestep_ratio: 0.18
      - stage: 1.0
        min_fraction_at_goal: 0.7
        min_success_rate: 0.15
        min_visibility_ratio: 0.62
        max_collision_event_count: 4.5
        min_progress_reward: 0.005
        min_timestep_ratio: 0.30

ppo_feedforward:
  # n_steps is per-env: 512 x 12 envs per rollout.
  n_steps: 512
  batch_size: 512
  n_epochs: 10
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01

ppo_recurrent:
  # 256 x 12 envs; batch_size is a multiple of n_envs.
  n_steps: 256
  batch_size: 384
  n_epochs: 10
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.005
  lstm_hidden_size: 256

evaluation:
  train_scenarios: ["train"]
  test_scenarios: ["test_procedural"]
  unseen_scenarios: ["unseen_split_field", "unseen_open_field"]
  deterministic: true
