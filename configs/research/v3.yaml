environment:
  grid_size: 20.0
  n_sheep: 10
  max_sheep: 16
  dog_speed: 1.0
  sheep_speed: 0.32
  flee_radius: 5.5
  cohesion_factor: 0.07
  repulsion_strength: 1.0
  leader_factor: 0.04
  goal: [18.0, 18.0]
  max_steps: 700
  success_radius: 2.0
  visibility_radius: 7.5
  max_obstacles: 8
  obstacle_size_range: [0.8, 1.8]
  obstacle_avoidance_threshold: 1.6

  # --- observation encoding -------------------------------------------------
  # "egocentric": normalized, masked sheep slots + lidar. "legacy": the original
  # layout with the 999.0 sentinel, kept only for the heuristic and behavioural
  # cloning agents that decode it directly.
  observation_mode: egocentric
  # "goal" makes the observation and action rotation-invariant about the goal
  # direction; "world" keeps world-aligned axes. Worth running as an ablation.
  observation_frame: world
  n_lidar_rays: 24
  lidar_range: 15.0

  # --- domain randomization -------------------------------------------------
  domain_randomization: true
  randomize_visibility: true
  randomize_goal: true
  randomize_obstacles: true
  randomize_dynamics: true
  randomize_sheep_count: true

  compute_expensive_metrics: false
  curriculum_mode: true
  visibility_loss_penalty: 0.05
  visibility_gain_reward: 0.8
  collision_penalty: 0.2
  w_drive_position: 0.35
  drive_position_scale: 0.7
  zero_visibility_penalty: 0.25
  progress_reward_scale: 3.0
  persistent_collision_scale: 0.15
  goal_seek_factor: 0.03
  # Reduced from 125.0: with VecNormalize on returns, a terminal bonus three
  # orders of magnitude above the per-step shaping made the value target
  # dominated by a single rare event.
  success_bonus: 20.0
  scenario: train

training:
  total_timesteps: 1000000
  save_dir: models/research_v3
  tensorboard_log: runs/research_v3
  eval_episodes: 8
  vec_env:
    n_envs: 12
    vec_env_type: subproc
    normalize_observations: true
    normalize_rewards: true
  validation:
    enabled: true
    scenario: validation
    episodes: 12
    eval_freq: 25000
    seed: 10000
  curriculum:
    strategy: adaptive
    window: 40
    warmup_episodes: 12
    stages:
      - stage: 0.0
        min_success_rate: 0.0
      - stage: 0.33
        min_fraction_at_goal: 0.30
        min_visibility_ratio: 0.40
        max_collision_event_count: 10.0
        min_progress_reward: -0.03
        min_timestep_ratio: 0.05
      - stage: 0.66
        min_fraction_at_goal: 0.55
        min_visibility_ratio: 0.50
        max_collision_event_count: 8.0
        min_progress_reward: -0.005
        min_timestep_ratio: 0.15
      - stage: 1.0
        min_fraction_at_goal: 0.70
        min_success_rate: 0.15
        min_visibility_ratio: 0.55
        max_collision_event_count: 6.0
        min_progress_reward: 0.0
        min_timestep_ratio: 0.30

ppo_feedforward:
  # n_steps is per-env: 512 x 12 envs = 6144 transitions per rollout, in the same
  # range as the old single-env 4096 but drawn from 12 independent randomization
  # draws instead of one.
  n_steps: 512
  batch_size: 512
  n_epochs: 10
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01

ppo_recurrent:
  # 256 x 12 envs = 3072 transitions per rollout. batch_size is a multiple of
  # n_envs so RecurrentPPO can split it into whole sequences.
  n_steps: 256
  batch_size: 384
  n_epochs: 10
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.005
  lstm_hidden_size: 256

evaluation:
  train_scenarios: ["train"]
  # Held-out procedural suite: the number to report.
  test_scenarios: ["test_procedural"]
  # Hand-authored presets, kept for qualitative comparison and rendering. Do not
  # tune against these; they are only five points.
  unseen_scenarios:
    [
      "unseen_corridor",
      "unseen_dense",
      "unseen_narrow_gate",
      "unseen_split_field",
      "unseen_open_field",
    ]
  deterministic: true

imitation:
  expert:
    use_cluster_targets: true
    cluster_activation_distance: 2.0
  data_collection:
    target_steps: 10000
    max_episodes: 256
    seed: 0
    deterministic: true
    train_scenarios: ["train"]
    unseen_scenarios: ["unseen_split_field", "unseen_open_field"]
    use_cluster_targets: true
    cluster_activation_distance: 2.0
  training:
    dataset_path: results/imitation/dataset/demonstrations.csv
    output_dir: models/imitation/random_forest
    model_path: models/imitation/random_forest/behavioral_cloning.pkl
    n_sheep: 10
    max_obstacles: 8
    validation_fraction: 0.2
    n_estimators: 300
    max_depth: 18
    min_samples_leaf: 2
    n_jobs: -1
    seed: 0
